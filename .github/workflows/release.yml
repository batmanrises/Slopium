name: Release

# Publishes a new release automatically.
#
#  * Edit "version" in app/appinfo.json and commit to main. This workflow notices the new
#    version, builds the package, writes the Homebrew Channel manifest and publishes
#    release v<version> (the tag is created for you).
#  * Or open the Actions tab, choose "Release" and click "Run workflow".
#    Tick "test_only" to just build a test .ipk (an artifact on the run page) without publishing.
#
# If release v<version> already exists nothing happens, so ordinary commits never
# publish by accident. The release text is the section of CHANGELOG.md for that version
# (the part under the "## <version>" heading), so write the changes there before you publish.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'packaging/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Only build a test package (download it from the run page); do not publish a release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TEST_ONLY: ${{ github.event.inputs.test_only }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and check whether it is already released
        id: ver
        run: |
          V="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' app/appinfo.json | head -n1)"
          if [ -z "$V" ]; then echo "Could not read the version from app/appinfo.json" >&2; exit 1; fi
          TAG="v$V"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$TEST_ONLY" = "true" ]; then
            echo "Test build only: building $TAG without publishing."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Raise the version in app/appinfo.json to publish a new one."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist yet, publishing it."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the package and the manifest
        if: steps.ver.outputs.exists == 'false'
        run: |
          bash tools/build-ipk.sh
          bash tools/make-manifest.sh

      - name: Keep the test package (test builds only)
        if: steps.ver.outputs.exists == 'false' && github.event.inputs.test_only == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: slopium-test-build
          path: build/*.ipk

      - name: Publish the release
        if: steps.ver.outputs.exists == 'false' && github.event.inputs.test_only != 'true'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VER="${TAG#v}"
          # Release text = the CHANGELOG.md section for this version (without its heading).
          tr -d '\r' < CHANGELOG.md | awk -v v="$VER" '
            /^## / {
              if (found) exit
              h = "## " v
              if (index($0, h) == 1) {
                rest = substr($0, length(h) + 1, 1)
                if (rest == "" || rest == ":" || rest == " ") { found = 1; next }
              }
            }
            found { print }
          ' | sed '/./,$!d' > build/release-notes.md
          if [ -s build/release-notes.md ]; then
            NOTES=(--notes-file build/release-notes.md)
          else
            NOTES=(--notes "See CHANGELOG.md for what changed. Install and update instructions are in the README.")
          fi
          gh release create "$TAG" build/*.ipk build/*.manifest.json \
            --target "$GITHUB_SHA" \
            --title "Slopium ${TAG#v}" \
            "${NOTES[@]}"
